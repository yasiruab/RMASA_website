name: Email log retention

on:
  schedule:
    # 01:00 UTC daily = 06:30 Sri Lanka time, after the unpaid-reminders run.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/email-log-retention
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET secret in repo settings."
            exit 1
          fi
          # -o /dev/null: Actions logs on this public repo are world-readable.
          # Print the status code only.
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -X POST "$SITE_URL/api/cron/email-log-retention" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120
